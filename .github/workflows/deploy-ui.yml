name: Deploy UI to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deploys at once.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # Render backend URL — set as a repo variable:
          # Settings → Secrets and variables → Actions → Variables → VITE_API_BASE
          # e.g. https://fpl-backend.onrender.com  (no trailing slash)
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          # Project-page base path, e.g. /fpl-season-review/
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      # SPA fallback: GitHub Pages serves 404.html for unknown paths, so a copy
      # of index.html makes deep links / refreshes work with client-side routing.
      - name: Add SPA 404 fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
